[project]
name = "meet"
version = "0.1.0"
description = "Static site and RSS generator for the NixOS Stockholm meetup group"
requires-python = ">=3.12"
dependencies = [
    "feedgen>=1.0.0",
    "jinja2>=3.1.0",
    "markdown>=3.6",
    "pydantic>=2.9",
    "tzdata>=2024.1",
]

[project.scripts]
meet-build = "meet.build:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src"]
plugins = ["pydantic.mypy"]
strict = true
# The point of the accessors in content.py is that nothing hands back an
# untyped value; this keeps that from regressing.
disallow_any_explicit = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Neither ships py.typed, so what they return is pinned by hand at the call site.
module = ["markdown.*", "feedgen.*"]
ignore_missing_imports = true

[tool.uv]
# Only resolve for the platforms the site is built on, so the lockfile carries
# no Windows or Intel Mac wheels. Mirrored by the system list in flake.nix.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.extra-build-dependencies]
# feedgen only publishes an sdist and its setup.py does not declare setuptools.
feedgen = ["setuptools"]
