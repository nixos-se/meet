name: deploy

on:
  push:
    branches: [main]
  # Meetups move from "upcoming" to "past" as time passes, so rebuild daily
  # even when nothing has been committed. A fresh runner has no Nix store, so
  # the derivation is rebuilt and the generator sees today's date; a binary
  # cache in front of this job would freeze it.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build .#site --print-build-logs
      # A writable copy: the artifact is tarred from a real directory rather
      # than a read-only store path behind a symlink.
      - run: cp -rL result public && chmod -R u+w public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
